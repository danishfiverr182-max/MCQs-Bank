# ─────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline — ExamEngine
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED GITHUB REPO SECRETS (Settings → Secrets and variables → Actions):
#
#   RENDER_DEPLOY_HOOK_URL   — The deploy hook URL from your Render service
#                              dashboard (Render → your service → Settings →
#                              Deploy Hook). A POST to this URL triggers a
#                              fresh build and deploy on Render. Treat it like
#                              a password — anyone with this URL can trigger
#                              a deploy.
#
#   VITE_API_BASE_URL        — The full backend API URL injected at Vite build
#                              time so the production client bundle points to
#                              the live Render backend, not localhost.
#                              Example: https://exam-engine-api.onrender.com/api
#                              NOTE: The current client uses a relative /api
#                              baseURL + Vite proxy for dev and Netlify
#                              redirects for production. Set this if you ever
#                              switch to an absolute URL in the client bundle.
#
#   NETLIFY_AUTH_TOKEN       — A Netlify personal access token (Netlify →
#                              User Settings → Applications → Personal access
#                              tokens). Used by the deploy action to
#                              authenticate API calls to Netlify.
#
#   NETLIFY_SITE_ID          — The "API ID" of your Netlify site (Netlify →
#                              your site → Site configuration → Site details).
#                              Tells the action which site to publish to.
#
# ─────────────────────────────────────────────────────────────────────────────
# BRANCH PROTECTION NOTE (one-time human setup — cannot be done via YAML):
#
#   To make the lint-and-test job a required gate for merging PRs, go to:
#   GitHub → your repo → Settings → Branches → Add branch protection rule
#   → Branch name pattern: main
#   → Check "Require status checks to pass before merging"
#   → Search for and select "lint-and-test (server)" and
#     "lint-and-test (client)"
#   → Optionally check "Require branches to be up to date before merging"
#   → Save changes.
#
#   Until this rule is set, the workflow will still run and report status,
#   but merging is not blocked by a failing check.
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────
  # Runs on every PR (blocks merge if branch protection is configured) AND on
  # every push to main. The deploy jobs declare `needs: lint-and-test`, so
  # they only run after this job passes — never on a red build.
  lint-and-test:
    name: lint-and-test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [server, client]
      # Run both workspaces in parallel; don't cancel the other if one fails.
      fail-fast: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.workspace }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.workspace }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.workspace }}
        # --passWithNoTests: succeeds even when no test files exist yet,
        # so the gate doesn't fail before tests are authored.
        run: npm test -- --passWithNoTests

  # ─── Deploy Backend → Render ─────────────────────────────────────────────
  # Fires only on an actual push to main (not on PRs, not on forks).
  # Using a deploy hook here means the deploy is always gated on
  # lint-and-test passing first — regardless of Render's own auto-deploy.
  deploy-backend:
    name: Deploy backend → Render
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # --fail: makes curl exit non-zero on HTTP 4xx/5xx responses so the
        # step is marked failed if the hook itself returns an error.

  # ─── Deploy Frontend → Netlify ───────────────────────────────────────────
  # Fires only on an actual push to main (not on PRs, not on forks).
  # Builds the Vite bundle with the production API URL injected, then
  # publishes client/dist to Netlify as a production deploy.
  deploy-frontend:
    name: Deploy frontend → Netlify
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies and build
        working-directory: client
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: client/dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
